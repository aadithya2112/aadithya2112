<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">The Build Log - Aadithya builds</title>
  <desc id="desc">Warm editorial masthead for Aadithya Senthil Kumaran, a full-stack engineer, with a release ledger showing open-source, hackathon, performance, and reliability results.</desc>
  <defs>
    <pattern id="paper-lines" width="1200" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 27.5H1200" stroke="#d8d0c2" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="paper-grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faintNoise">
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faintNoise" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="18" fill="#f3efe5"/>
  <rect width="1200" height="560" rx="18" fill="url(#paper-lines)"/>
  <g filter="url(#paper-grain)">
    <path d="M48 40H1152M48 96H1152" stroke="#1c1915" stroke-width="2"/>
    <text x="50" y="73" fill="#d8442d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" letter-spacing="4">THE BUILD LOG</text>
    <text x="600" y="73" fill="#6f695f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2">FULL-STACK ENGINEERING</text>
    <text x="1150" y="73" fill="#1c1915" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2">VOL. 07 / 2026</text>

    <text x="48" y="239" fill="#171510" font-family="Georgia, Times New Roman, serif" font-size="142" letter-spacing="-8">AADITHYA</text>
    <text x="429" y="355" fill="#d8442d" font-family="Georgia, Times New Roman, serif" font-size="142" font-style="italic" letter-spacing="-8">builds.</text>

    <path d="M48 386H1152" stroke="#1c1915" stroke-width="5"/>
    <text x="49" y="420" fill="#1c1915" font-family="Georgia, Times New Roman, serif" font-size="22">Useful software, all the way down.</text>
    <text x="1151" y="420" fill="#6f695f" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1">PRODUCT / SYSTEMS / OPEN SOURCE</text>

    <path d="M48 448H1152M324 448V528M600 448V528M876 448V528M48 528H1152" stroke="#8e8679" stroke-width="1"/>

    <text x="49" y="491" fill="#d8442d" font-family="Georgia, Times New Roman, serif" font-size="35">70+</text>
    <text x="49" y="514" fill="#1c1915" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">MERGED PULL REQUESTS</text>

    <text x="348" y="491" fill="#d8442d" font-family="Georgia, Times New Roman, serif" font-size="35">04</text>
    <text x="348" y="514" fill="#1c1915" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">HACKATHONS WON</text>

    <text x="624" y="491" fill="#d8442d" font-family="Georgia, Times New Roman, serif" font-size="35">40%</text>
    <text x="624" y="514" fill="#1c1915" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">FASTER AUTHENTICATION</text>

    <text x="900" y="491" fill="#d8442d" font-family="Georgia, Times New Roman, serif" font-size="35">99.9%</text>
    <text x="900" y="514" fill="#1c1915" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">UPTIME ACROSS ENVIRONMENTS</text>
  </g>
</svg>
