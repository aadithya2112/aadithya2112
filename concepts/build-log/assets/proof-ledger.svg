<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="306" viewBox="0 0 1200 306" role="img" aria-labelledby="title desc">
  <title id="title">Aadithya's proof ledger</title>
  <desc id="desc">Four evidence cards: 70 plus merged Talawa pull requests, four hackathon wins, 40 percent faster authentication, and 99.9 percent uptime.</desc>
  <rect width="1200" height="306" rx="16" fill="#191713"/>
  <path d="M36 58H1164M36 264H1164" stroke="#f2ede1" stroke-width="1" opacity="0.35"/>
  <text x="38" y="37" fill="#f2ede1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5">EVIDENCE LEDGER / VERIFIED SHIPMENTS</text>
  <text x="1162" y="37" fill="#d84a32" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">NO VANITY METRICS</text>

  <g transform="translate(36 78)">
    <path d="M266 0V166" stroke="#6f695f"/>
    <text x="0" y="68" fill="#e04a33" font-family="Georgia, Times New Roman, serif" font-size="78">70+</text>
    <text x="0" y="103" fill="#f2ede1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">MERGED PRS</text>
    <text x="0" y="133" fill="#aaa296" font-family="Arial, Helvetica, sans-serif" font-size="14">Rootless Docker, cache warming,</text>
    <text x="0" y="154" fill="#aaa296" font-family="Arial, Helvetica, sans-serif" font-size="14">refactors and tests for Talawa.</text>
  </g>

  <g transform="translate(318 78)">
    <path d="M266 0V166" stroke="#6f695f"/>
    <text x="0" y="68" fill="#e04a33" font-family="Georgia, Times New Roman, serif" font-size="78">04</text>
    <text x="0" y="103" fill="#f2ede1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">HACKATHON WINS</text>
    <text x="0" y="133" fill="#aaa296" font-family="Arial, Helvetica, sans-serif" font-size="14">Including NatWest Group's</text>
    <text x="0" y="154" fill="#aaa296" font-family="Arial, Helvetica, sans-serif" font-size="14">Code For Purpose, May 2026.</text>
  </g>

  <g transform="translate(600 78)">
    <path d="M266 0V166" stroke="#6f695f"/>
    <text x="0" y="68" fill="#e04a33" font-family="Georgia, Times New Roman, serif" font-size="78">40%</text>
    <text x="0" y="103" fill="#f2ede1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">FASTER AUTH</text>
    <text x="0" y="133" fill="#aaa296" font-family="Arial, Helvetica, sans-serif" font-size="14">OAuth 2.0, JWT and bcrypt</text>
    <text x="0" y="154" fill="#aaa296" font-family="Arial, Helvetica, sans-serif" font-size="14">deployed on AWS EC2.</text>
  </g>

  <g transform="translate(882 78)">
    <text x="0" y="68" fill="#e04a33" font-family="Georgia, Times New Roman, serif" font-size="78">99.9%</text>
    <text x="0" y="103" fill="#f2ede1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.5">UPTIME</text>
    <text x="0" y="133" fill="#aaa296" font-family="Arial, Helvetica, sans-serif" font-size="14">Measured across the Runverve</text>
