<svg width="1280" height="250" viewBox="0 0 1280 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Selected engineering telemetry</title>
  <desc id="desc">Seventy plus merged open-source pull requests, four hackathon wins, forty percent faster authentication, and 99.9 percent uptime.</desc>
  <defs>
