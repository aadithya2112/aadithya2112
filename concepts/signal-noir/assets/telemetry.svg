      <text y="108" fill="#5F7B84" font-size="10">BUILT UNDER PRESSURE</text>
    </g>
    <g transform="translate(672 99)">
      <text y="55" fill="#23D7F4" font-size="48" font-weight="750" letter-spacing="-2">40%</text>
      <text y="84" fill="#A5BAC1" font-size="11" font-weight="700" letter-spacing="1.5">FASTER AUTH</text>
      <text y="108" fill="#5F7B84" font-size="10">MEASURED IMPROVEMENT</text>
