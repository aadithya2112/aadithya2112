<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Aadithya Senthil Kumaran — Full stack developer</title>
  <desc id="desc">Building thoughtful software, from interface to infrastructure. A violet orbital illustration connects code, systems, and the web.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121322"/><stop offset="1" stop-color="#19152e"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".24"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#a5a0cb" opacity=".12"/></pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#bg)" stroke="#36304e"/>
  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#dots)"/>
  <ellipse cx="970" cy="170" rx="275" ry="230" fill="url(#glow)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="66" fill="#b3a4e4" font-family="monospace" font-size="15" letter-spacing="3">HELLO, WORLD. I'M</text>
    <text x="54" y="177" font-size="100" font-weight="700" letter-spacing="-5" fill="#f5f3ff">Aadithya<tspan fill="#a78bfa">.</tspan></text>
    <text x="60" y="220" font-size="23" fill="#c3bdd8">Full stack developer · Curious about systems</text>
    <path d="M60 259H645" stroke="#38304e"/>
    <text x="60" y="299" font-family="monospace" font-size="16" fill="#a49ab9">from interface <tspan fill="#c4b5fd">→</tspan> infrastructure</text>
  </g>
  <g transform="translate(949 176)" fill="none">
    <circle r="113" stroke="#4c3f72" stroke-dasharray="3 9"/>
    <ellipse rx="164" ry="64" transform="rotate(-30)" stroke="#8b70be" stroke-opacity=".7"/>
    <ellipse rx="164" ry="64" transform="rotate(30)" stroke="#6b5a98" stroke-opacity=".7"/>
    <rect x="-64" y="-64" width="128" height="128" rx="30" transform="rotate(-12)" fill="#211c36" stroke="#77609f"/>
    <path d="M-25-17L-43 0L-25 17M25-17L43 0L25 17M9-29L-9 29" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="6" fill="#c4b5fd" stroke="#171426" stroke-width="3">
      <animateMotion dur="16s" repeatCount="indefinite" path="M142-82 A164 64 -30 1 1 -142 82 A164 64 -30 1 1 142-82"/>
    </circle>
    <circle cx="-98" cy="-56" r="5" fill="#7dd3c7"/>
    <circle cx="98" cy="56" r="5" fill="#c4b5fd"/>
  </g>
  <g font-family="monospace" font-size="12" letter-spacing="2" fill="#a49ab9">
    <text x="891" y="326">BUILD. LEARN. REPEAT.</text>
  </g>
</svg>
